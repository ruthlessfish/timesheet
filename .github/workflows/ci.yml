name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ 8.2, 8.3 ]
                db: [ sqlite, mysql, pgsql ]
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s --health-timeout=5s --health-retries=3
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres" --health-interval=10s
                    --health-timeout=5s --health-retries=3

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, pdo_mysql, pdo_pgsql
                  coverage: none

            - name: Get Composer Cache
              uses: actions/cache@v3
              with:
                  path: ~/.composer/cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer Dependencies
              run: composer install --no-progress --no-suggest --prefer-dist

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php -r "file_exists('.env') || copy('.env.example', '.env');"
                  php artisan key:generate --ansi

            - name: Configure DB
              run: |
                  if [ "${{ matrix.db }}" = "mysql" ]; then
                    php artisan config:clear
                    php artisan env:set DB_CONNECTION=mysql || true
                    php artisan env:set DB_HOST=127.0.0.1 || true
                    php artisan env:set DB_PORT=3306 || true
                    php artisan env:set DB_DATABASE=test || true
                    php artisan env:set DB_USERNAME=root || true
                    php artisan env:set DB_PASSWORD=root || true
                  elif [ "${{ matrix.db }}" = "pgsql" ]; then
                    php artisan env:set DB_CONNECTION=pgsql || true
                    php artisan env:set DB_HOST=127.0.0.1 || true
                    php artisan env:set DB_PORT=5432 || true
                    php artisan env:set DB_DATABASE=test || true
                    php artisan env:set DB_USERNAME=postgres || true
                    php artisan env:set DB_PASSWORD=postgres || true
                  else
                    php artisan env:set DB_CONNECTION=sqlite || true
                    touch database/database.sqlite || true
                    php artisan env:set DB_DATABASE=database/database.sqlite || true
                  fi

            - name: Run migrations
              run: php artisan migrate --no-interaction --force

            - name: Run tests
              run: php artisan test --no-coverage --quiet
