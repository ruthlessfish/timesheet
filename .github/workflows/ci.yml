name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ 8.4 ]
                db: [ sqlite ]
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, pdo_mysql, pdo_pgsql
                  coverage: none

            - name: Get Composer Cache
              uses: actions/cache@v3
              with:
                  path: ~/.composer/cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer Dependencies
              run: composer install --no-progress --no-suggest --prefer-dist

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php -r "file_exists('.env') || copy('.env.example', '.env');"
                  php artisan key:generate --ansi

            - name: Configure DB
              run: |
                  php artisan env:set DB_CONNECTION=sqlite || true
                  touch database/database.sqlite || true
                  php artisan env:set DB_DATABASE=database/database.sqlite || true

            - name: Run migrations
              run: php artisan migrate --no-interaction --force

            - name: Run tests
              run: php artisan test --no-coverage --quiet
